<title>La Forge des Brumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070504;--txt:#eadfcc;--dim:#9a8b78;--ember:#ff7a2a;--ember2:#ffb060;--gold:#e8c878;--bad:#ff6a5a;--good:#9fe07a;--f-t:"Cinzel Decorative","Cinzel",serif;--f-h:"Cinzel",serif;--f-b:"Alegreya",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--f-b);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none;display:inline-block}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
#ui>*{pointer-events:auto}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(#000d,#0000)}
#mid{flex:1;min-height:0;pointer-events:none;position:relative}
#bot{padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(#0000,#000e 35%);display:flex;flex-direction:column;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-h);font-weight:800;font-size:14px;padding:4px 10px;border-radius:20px;background:#0009;border:1px solid #ffffff12}
.grow{flex:1}
.btn{font-family:var(--f-h);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);background:linear-gradient(#2a1e18,#120c0a);border:1px solid #4a3424;border-radius:14px;padding:14px 18px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 #ffffff12,0 4px 14px #000a;transition:transform .1s,box-shadow .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn .ic{width:20px;height:20px}
.btn.main{background:linear-gradient(#a8401a,#5a1a08);border-color:#ff9a5a;color:#fff2e0;font-size:19px;padding:18px 22px;box-shadow:inset 0 1px 0 #ffffff40,0 0 26px #ff5a1a66;animation:glow 2.2s infinite}
@keyframes glow{50%{box-shadow:inset 0 1px 0 #ffffff40,0 0 40px #ff7a2aaa}}
.btn.ghost{background:#0008;border-color:#3a2a20}
.btn.sm{padding:9px 12px;font-size:12px;border-radius:10px}
.btn.icon{padding:10px;border-radius:50%}
.btn.off{filter:grayscale(1) brightness(.55);pointer-events:none}
.row{display:flex;gap:8px;align-items:center}.row.w{width:100%;max-width:460px}.row.w>.btn{flex:1}
.hint{font-size:14px;color:var(--dim);text-align:center;min-height:20px;text-shadow:0 2px 4px #000}
.hint b{color:var(--ember2)}
.hearts{display:inline-flex;gap:2px}
.hearts i{width:16px;height:15px;display:inline-block;background:var(--bad);clip-path:path("M8 15 1.5 8.5C-1 6 0 1 4 1c2 0 3 1.4 4 2.6C9 2.4 10 1 12 1c4 0 5 5 2.5 7.5z");filter:drop-shadow(0 0 3px #f004)}
.hearts i.e{background:#3a2420}
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 20px calc(env(safe-area-inset-bottom) + 10vh);text-align:center}
.logo{font-family:var(--f-t);font-weight:900;font-size:clamp(40px,10vw,78px);line-height:.95;color:#ffe2b0;text-shadow:0 0 30px #ff5a1a,0 0 70px #ff3a0a88,0 4px 0 #3a1408}
.logo small{display:block;font-family:var(--f-h);font-size:.24em;letter-spacing:.5em;color:#c89a6a;margin-top:10px;text-shadow:0 0 8px #000}
.lore{font-style:italic;color:#d4c4aa;line-height:1.5;text-shadow:0 2px 6px #000}
/* feuille (panneau du bas) */
#sheet{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#sheet[hidden]{display:none}
#sheet .box{width:100%;max-width:560px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(#1a120e,#0e0907);border:1px solid #4a3424;border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px #000;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@media (min-width:700px){#sheet{align-items:center}#sheet .box{border-radius:22px;border-bottom:1px solid #4a3424}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:#4a3a30;margin:0 auto 12px}
h1,h2,h3{font-family:var(--f-h);margin:0 0 8px;letter-spacing:.04em}
h2{font-size:20px;color:var(--gold)}h3{font-size:16px;color:var(--ember2)}
p{margin:6px 0;line-height:1.45}.dim{color:var(--dim)}.small{font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .btn{flex:1;padding:10px 4px;font-size:12px;border-radius:10px}.tabs .btn.on{border-color:var(--ember);color:var(--ember2);box-shadow:0 0 14px #ff7a2a44}
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #2e2018;border-radius:14px;background:#0006;margin-bottom:8px}
.item.on{border-color:var(--ember);box-shadow:0 0 16px #ff7a2a33}
.item.lock{filter:grayscale(.9) brightness(.55)}
.item .pat{flex:none}
.item .grow{min-width:0}
.cost{display:inline-flex;gap:8px;font-size:13px;font-family:var(--f-h);font-weight:800}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost .no{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid #2e2018;border-radius:14px;background:#0006;padding:12px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.97)}.card.on{border-color:var(--ember);box-shadow:0 0 18px #ff7a2a44}.card.lock{filter:grayscale(.9) brightness(.5);cursor:default}
.card canvas{display:block;margin:0 auto}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast{background:#140c08ee;border:1px solid #5a3a22;border-left:3px solid var(--ember);border-radius:10px;padding:9px 14px;font-size:14px;text-align:center;box-shadow:0 6px 20px #000c;animation:up .3s,out .4s 2.6s forwards}
@keyframes out{to{opacity:0;transform:translateY(-8px)}}
#toasts .toast:nth-last-child(n+3){display:none}
.big{font-family:var(--f-t);font-size:30px;color:#ffe2b0;text-shadow:0 0 20px #ff5a1a}
.center{text-align:center}
.boon{display:block;width:100%;text-align:left;text-transform:none;letter-spacing:0;font-family:var(--f-b);font-size:15px;padding:14px;margin:8px 0;border-radius:14px}
.boon b{font-family:var(--f-h);color:var(--ember2);font-size:15px;display:block;margin-bottom:2px}
.minigame{position:relative;height:54px;border-radius:27px;background:#0a0605;border:2px solid #4a3424;overflow:hidden;margin:14px 0}
.minigame .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:linear-gradient(90deg,#ffb04a00,#ffb04a88,#ffb04a00)}
.minigame .zone.ok{left:30%;width:40%;background:linear-gradient(90deg,#ff7a2a00,#ff7a2a33,#ff7a2a00)}
.minigame .cur{position:absolute;top:4px;bottom:4px;width:6px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff}
.strikes{display:flex;gap:10px;justify-content:center;font-size:26px}
.strikes span{opacity:.3}.strikes span.p{opacity:1;color:var(--ember2);text-shadow:0 0 12px var(--ember)}.strikes span.g{opacity:1;color:#d8d0c0}.strikes span.m{opacity:1;color:#6a5a4a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
