<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge des Brumes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<title>La Forge des Brumes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout : coque de jeu plein écran — HUD en haut, navigation latérale (barre du bas sur téléphone), vue centrale défilante.
   Monde unique sombre (fer forgé, braises, brume) : thème volontairement unique. */
:root{
  --bg:#0b0908; --bg2:#13100d; --panel:#19140f; --panel2:#211a14; --well:#0f0c0a;
  --line:#4b3d2c; --line-hi:#8f7046; --rivet:#c9a35e;
  --gold:#d5ae63; --gold-hi:#f1d695; --ember:#ec7a30; --ember-deep:#8a3b16;
  --mist:#a3c4d8; --mist-deep:#355466;
  --text:#ece1cb; --muted:#a8977d; --faint:#6f6352;
  --hp:#c63d30; --en:#3e86cc; --faim:#d69c2f; --soif:#36a6c8; --xp:#c9a35e;
  --r0:#bdb6a8; --r1:#5594dc; --r2:#ab6fe4; --r3:#eda442;
  --good:#86b56d; --bad:#e0604f; --verdant:#3f7a43;
  --f-display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-body:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
*{box-sizing:border-box}
::selection{background:var(--ember-deep)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:200px 1fr;grid-template-areas:"hud hud" "nav view";
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;
  background:radial-gradient(1200px 600px at 70% -10%,rgba(236,122,48,.10),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(163,196,216,.07),transparent 60%),var(--bg)}
#hud{grid-area:hud}
#nav{grid-area:nav;min-height:0;overflow:auto}
#view{grid-area:view;min-width:0;min-height:0;overflow:auto;scrollbar-color:var(--line) transparent}
#app.solo{grid-template-columns:1fr;grid-template-areas:"view";grid-template-rows:1fr}
#app.solo #hud,#app.solo #nav{display:none}

/* ── Panneaux fer forgé ───────────────────────────── */
.panel{position:relative;background:linear-gradient(180deg,rgba(255,236,200,.04),transparent 38%),var(--panel);border:1px solid #000;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 2px #0a0806,inset 0 0 0 3px rgba(143,112,70,.25),0 8px 22px rgba(0,0,0,.55);padding:14px}
.panel::before,.panel::after{content:"";position:absolute;top:5px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold-hi),#6a4d22 60%,#000);pointer-events:none}
.panel::before{left:5px}.panel::after{right:5px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-display);font-weight:600;color:var(--gold-hi);letter-spacing:.05em;font-size:15px;
  padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--line-hi),transparent) 1;text-wrap:balance}
.ph small{font-family:var(--f-body);color:var(--muted);letter-spacing:0;font-weight:400;font-size:14px}
.parch{background:linear-gradient(180deg,#d9c39a,#c4a978);color:#2a1d10;box-shadow:inset 0 0 30px rgba(90,60,20,.45),0 6px 16px rgba(0,0,0,.5);border-radius:2px;padding:14px}
.parch .ph{color:#3a2814;border-image:linear-gradient(90deg,#7a5a30,transparent) 1}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.04em;text-wrap:balance}

/* ── Boutons ─────────────────────────────────────── */
.btn{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--gold-hi);cursor:pointer;
  background:linear-gradient(180deg,#5e3f1d,#2c1d0f);border:1px solid #000;border-radius:3px;padding:9px 16px;text-shadow:0 1px 0 #000;
  box-shadow:inset 0 0 0 1px #a27b3f,inset 0 1px 0 1px rgba(255,222,160,.22),0 3px 8px rgba(0,0,0,.5);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px) scale(.98);filter:brightness(1.3)}
.btn{transition:filter .15s,transform .08s}
.btn:focus-visible,.tile:focus-visible,.navb:focus-visible,.slot:focus-visible,.row:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.btn.ember{background:linear-gradient(180deg,#a0461a,#4a1d0a);box-shadow:inset 0 0 0 1px #f0a060,inset 0 1px 0 1px rgba(255,210,150,.3),0 0 18px rgba(236,122,48,.35)}
.btn.verd{background:linear-gradient(180deg,#2f6a3a,#123019);box-shadow:inset 0 0 0 1px #8fd08f,inset 0 1px 0 1px rgba(200,255,200,.2),0 0 16px rgba(80,180,90,.25);color:#e9f7df}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.wide{width:100%}

/* ── HUD ─────────────────────────────────────────── */
#hud{display:flex;align-items:center;gap:14px;padding:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:6px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.06em;background:linear-gradient(180deg,#fbe7b4,#c98d3c 70%,#7a4a19);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;white-space:nowrap}
.brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.crest{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #000,0 0 0 3px var(--line-hi),0 0 14px rgba(236,122,48,.3);background:radial-gradient(circle at 50% 40%,#3a2b1d,#110c08);display:grid;place-items:center}
.who .nm{font-family:var(--f-display);font-size:15px;color:var(--text);white-space:nowrap}
.who .cl{font-size:13.5px;color:var(--muted);white-space:nowrap}
.xpbar{height:5px;width:150px;background:#000;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line);margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a2a,var(--gold-hi))}
.curr{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.cur{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:20px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums;font-size:15px}
.cur svg{width:24px;height:24px}
.clock{font-size:13px;color:var(--muted);text-align:right;line-height:1.15;white-space:nowrap}
.clock b{display:block;color:var(--text);font-weight:500}

/* ── Navigation ─────────────────────────────────── */
#nav{display:flex;flex-direction:column;gap:3px;padding:10px 8px}
.navb{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:3px;cursor:pointer;font-family:var(--f-display);font-size:14px;color:var(--muted);letter-spacing:.03em;text-align:left;position:relative}
.navb svg{width:24px;height:24px;flex:none;color:var(--gold)}
.navb:hover{color:var(--text);background:rgba(255,230,190,.04)}
.navb.on{color:var(--gold-hi);background:linear-gradient(90deg,rgba(236,122,48,.22),rgba(236,122,48,.02));box-shadow:inset 2px 0 0 var(--ember)}
.navb .dot{position:absolute;right:8px;top:50%;translate:0 -50%;min-width:18px;height:18px;border-radius:9px;background:#a3271c;color:#fff;font-size:11px;display:grid;place-items:center;font-family:var(--f-body);box-shadow:0 0 0 1px #000}
.nav-foot{margin-top:auto;padding:10px 6px 2px;font-style:italic;color:var(--faint);font-size:14px}
.save{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-style:normal;margin-top:8px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good)}

/* ── Grilles de vues ────────────────────────────── */
.grid{display:grid;gap:10px}
.home{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.home-main{display:grid;gap:10px;min-width:0}
.home-side{display:grid;gap:10px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.scene{position:relative;height:clamp(340px,62vh,640px);padding:0;overflow:hidden}
.scene canvas{display:block;width:100%;height:100%;border-radius:3px;cursor:pointer}
.scene .hint{position:absolute;left:12px;bottom:10px;font-style:italic;color:var(--muted);font-size:14px;pointer-events:none;text-shadow:0 1px 2px #000}
.scene .tag{position:absolute;left:12px;top:10px;font-family:var(--f-display);color:var(--gold-hi);font-size:15px;letter-spacing:.05em;text-shadow:0 1px 3px #000;pointer-events:none}

.bars{display:grid;gap:9px}
.bar .lab{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:3px}
.bar .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .tr{height:8px;background:#060504;border-radius:4px;box-shadow:inset 0 0 0 1px #2d241a;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px;transition:width .4s}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stat{background:var(--well);border-radius:3px;padding:6px 8px;box-shadow:inset 0 0 0 1px #2a2219;font-size:13px;color:var(--muted)}
.stat b{display:block;color:var(--text);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}

.evcard{padding:0;overflow:hidden}
.evart{height:92px;position:relative}
.evart canvas{width:100%;height:100%;display:block}
.evbody{padding:12px 14px 14px}
.evbody h3{font-size:17px;color:var(--gold-hi)}
.timer{font-variant-numeric:tabular-nums;color:var(--ember);font-size:15px}

.list{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:3px;background:var(--well);box-shadow:inset 0 0 0 1px #2a2219;cursor:pointer;border:0;text-align:left;width:100%;min-width:0}
.row:hover{box-shadow:inset 0 0 0 1px var(--line-hi)}
.row.on{box-shadow:inset 0 0 0 1px var(--gold),0 0 12px rgba(213,174,99,.2);background:linear-gradient(90deg,rgba(213,174,99,.12),var(--well))}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--muted)}
.row.off{opacity:.55}

/* ── Objets ─────────────────────────────────────── */
.slot{width:58px;height:58px;flex:none;border-radius:4px;position:relative;display:grid;place-items:center;cursor:pointer;border:0;padding:0;
  background:radial-gradient(circle at 50% 40%,#2c241b,#0e0b09 75%);box-shadow:inset 0 0 0 1px #3a2f22,0 2px 4px rgba(0,0,0,.6)}
.slot svg{width:80%;height:80%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.slot .q{position:absolute;right:4px;bottom:1px;font-size:13px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot .up{position:absolute;left:4px;top:1px;font-size:12px;color:var(--gold-hi);text-shadow:0 1px 2px #000}
.slot.sm{width:44px;height:44px}
.slot.lg{width:96px;height:96px}
.slot.empty{cursor:default;opacity:.55}
.slot.r1{box-shadow:inset 0 0 0 1px var(--r1),inset 0 0 14px rgba(85,148,220,.35),0 2px 4px rgba(0,0,0,.6)}
.slot.r2{box-shadow:inset 0 0 0 1px var(--r2),inset 0 0 16px rgba(171,111,228,.4),0 2px 4px rgba(0,0,0,.6)}
.slot.r3{box-shadow:inset 0 0 0 1px var(--r3),inset 0 0 18px rgba(237,164,66,.45),0 0 10px rgba(237,164,66,.25)}
.slot.sel{outline:2px solid var(--gold-hi);outline-offset:1px}
.slot.r3{overflow:hidden}
.slot.r3::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,226,160,.38) 50%,transparent 58%);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
#view.enter>*{animation:vin .24s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
#modal:not([hidden]) .panel{animation:min .2s ease-out}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}}
.slot .better{position:absolute;right:3px;top:1px;font-size:12px;color:#8fe08a;text-shadow:0 0 4px #1a4a1a,0 1px 2px #000;line-height:1}
.slot.broken svg{filter:grayscale(1) brightness(.6)}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,58px);gap:8px;justify-content:start}

/* ── Atelier ────────────────────────────────────── */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-family:var(--f-display);font-size:13.5px;letter-spacing:.04em;padding:8px 14px;border-radius:3px 3px 0 0;border:0;cursor:pointer;color:var(--muted);background:var(--well);box-shadow:inset 0 0 0 1px #2a2219}
.tab.on{color:var(--gold-hi);background:linear-gradient(180deg,#4a3218,#21170d);box-shadow:inset 0 0 0 1px #a27b3f}
.forge{grid-template-columns:190px minmax(0,1fr) minmax(0,1.15fr);align-items:start}
.cat{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:3px;font-size:15.5px;text-align:left}
.cat svg{width:22px;height:22px;color:var(--gold)}
.cat.on{color:var(--gold-hi);background:rgba(213,174,99,.1);box-shadow:inset 0 0 0 1px rgba(213,174,99,.35)}
.detail{display:grid;gap:12px}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead h2{font-size:20px;color:var(--gold-hi)}
.mats{display:flex;gap:10px;flex-wrap:wrap}
.mat{display:grid;justify-items:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.ko{color:var(--bad)}
.chances{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:13px;text-align:center}
.chances div{background:var(--well);border-radius:3px;padding:5px 2px;box-shadow:inset 0 0 0 1px #2a2219}
.chances b{display:block;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.reason{font-size:14px;color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.sockets{display:flex;gap:8px;flex-wrap:wrap}
.sock{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1d1712,#060504);box-shadow:inset 0 0 0 1px var(--line-hi),inset 0 0 10px #000;border:0;padding:0;cursor:pointer}
.sock svg{width:34px;height:34px}
.sock.empty{cursor:default;opacity:.5}

/* ── Maîtrise ───────────────────────────────────── */
.mast{grid-template-columns:repeat(3,minmax(0,1fr))}
.branch{display:grid;gap:12px;justify-items:center;text-align:center}
.branch h3{font-size:18px}
.node{width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#2f251b,#0b0806);box-shadow:inset 0 0 0 2px #3b2f22,0 0 0 1px #000}
.node svg{width:36px;height:36px;opacity:.45}
.node.on{box-shadow:inset 0 0 0 2px var(--bc),0 0 18px var(--bc),0 0 0 1px #000}
.node.on svg{opacity:1}
.node.can{box-shadow:inset 0 0 0 2px var(--line-hi),0 0 0 1px #000;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 12px rgba(241,214,149,.35),0 0 0 1px #000}}
.link{width:2px;height:16px;background:linear-gradient(var(--line),var(--line-hi))}
.nodetxt{font-size:14px;max-width:220px}
.nodetxt b{display:block;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--text)}

/* ── Quêtes / évènements ───────────────────────── */
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.qicon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#3a2a19,#0e0a07);box-shadow:0 0 0 1px var(--line-hi)}
.qicon svg{width:26px;height:26px;color:var(--gold)}
.prog{height:5px;background:#000;border-radius:3px;overflow:hidden;margin-top:5px;box-shadow:0 0 0 1px #2a2219;max-width:280px}
.prog i{display:block;height:100%;background:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 8px;border-radius:10px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--line-hi)}
.chip.done{color:var(--good);box-shadow:inset 0 0 0 1px #3d5a30}

/* ── Expédition ─────────────────────────────────── */
.dgcards{grid-template-columns:repeat(2,minmax(0,1fr))}
.dg{padding:0;overflow:hidden}
.dg.locked canvas{filter:grayscale(.7) brightness(.6)}
.abyssgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);align-items:stretch}
.dg.abyss{box-shadow:inset 0 0 0 1px #5a3a8a,0 0 26px rgba(120,70,200,.18)}
.dg.abyss canvas{height:100%;min-height:200px}
.dg.abyss h3{color:#d8bfff}
.spec{display:grid;gap:8px;padding:12px;border-radius:4px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.spec>b{font-family:var(--f-display);font-size:17px;color:var(--gold-hi)}
.spec.on{box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 16px rgba(241,214,149,.15)}
.spec.off{opacity:.45}
.spec .sk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.spec .sk .qicon{width:34px;height:34px;flex:none;color:var(--gold-hi)}
.lore{display:block;font-style:italic;color:var(--muted);font-size:14px;margin-top:4px}
.node.sknode{border-radius:14px}
.merc{padding:0;overflow:hidden;display:grid;grid-template-columns:140px 1fr}
.merc canvas{width:140px;height:150px;align-self:center;background:radial-gradient(circle at 50% 70%,#2a2118,transparent 70%)}
.merc .b{padding:12px;display:grid;gap:8px;min-width:0}
.merc .statgrid{grid-template-columns:repeat(4,minmax(0,1fr))!important}.merc .stat{padding:6px 4px;font-size:12.5px}
.quest .chip,.row .chip{white-space:normal;max-width:100%}
.merc h3{font-size:18px;color:var(--gold-hi)}
.boon.relic{box-shadow:inset 0 0 0 1px #8a5ad0,0 0 14px rgba(150,90,230,.25)}
.boon.relic .qicon{color:#c9a6ff}
.dg canvas{display:block;width:100%;height:170px}
.dg .b{padding:14px;display:grid;gap:8px}
.dg h3{font-size:19px;color:var(--gold-hi)}
.depths{display:flex;gap:4px}
.depths i{flex:1;height:6px;border-radius:2px;background:#000;box-shadow:inset 0 0 0 1px #33291e}
.depths i.on{background:var(--mist);box-shadow:0 0 6px var(--mist)}
.depths i.boss{background:#5a1a12}.depths i.boss.on{background:var(--ember);box-shadow:0 0 6px var(--ember)}

#dun{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:0}
.dtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px}
.dtop h2{font-size:17px;color:var(--gold-hi)}
.dtop .sub{font-size:14px;color:var(--muted)}
.mini{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mini .bar{width:110px}
.mini .bar .lab{font-size:12.5px}
.dmid{position:relative;min-height:0;padding:0;overflow:hidden}
.dmid canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.unitcard{position:absolute;right:10px;top:10px;width:210px;padding:10px 12px;font-size:14px;pointer-events:none}

.turnflag{position:absolute;left:50%;top:10px;translate:-50% 0;font-family:var(--f-display);font-size:14px;letter-spacing:.12em;padding:5px 14px;border-radius:2px;background:rgba(10,8,6,.8);box-shadow:inset 0 0 0 1px var(--line-hi);pointer-events:none;white-space:nowrap}
.dlog{position:absolute;left:10px;bottom:10px;max-width:min(360px,60%);font-size:13.5px;color:var(--muted);pointer-events:none;text-shadow:0 1px 2px #000;display:grid;gap:2px}
.dlog div:last-child{color:var(--text)}
.dbar{display:flex;gap:8px;padding:10px;flex-wrap:wrap;justify-content:center}
.dbar .btn{min-width:120px;font-size:15px;padding:11px 14px}
.act-atk{background:linear-gradient(180deg,#8f2318,#3c0c07)!important;box-shadow:inset 0 0 0 1px #e07a5f,0 3px 8px rgba(0,0,0,.5)!important}
.act-sk{background:linear-gradient(180deg,#24497a,#0c1d33)!important;box-shadow:inset 0 0 0 1px #7fb0e8,0 3px 8px rgba(0,0,0,.5)!important}
.act-obj{background:linear-gradient(180deg,#2c6a39,#0f2a15)!important;box-shadow:inset 0 0 0 1px #8fd08f,0 3px 8px rgba(0,0,0,.5)!important}
.btn.armed{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ── Création de personnage ─────────────────────── */
.create{height:100%;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(280px,360px);gap:10px;min-height:0}
.create>*{min-height:0}
.classlist{overflow:auto;display:grid;gap:5px;align-content:start}
.ccls{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:3px;cursor:pointer;border:0;background:var(--well);box-shadow:inset 0 0 0 1px #2a2219;text-align:left;width:100%}
.ccls .ci{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle,#3a2a19,#0e0a07);box-shadow:0 0 0 1px var(--line-hi)}
.ccls .ci svg{width:24px;height:24px}
.ccls b{display:block;font-family:var(--f-display);font-weight:600;font-size:14.5px;color:var(--text)}
.ccls span{font-size:13.5px;color:var(--muted)}
.ccls.on{background:linear-gradient(90deg,rgba(236,122,48,.25),var(--well));box-shadow:inset 0 0 0 1px var(--gold)}
.ccls.on b{color:var(--gold-hi)}
.stage{position:relative;padding:0;overflow:hidden;display:grid;grid-template-rows:minmax(240px,1fr) auto auto}
.stage canvas{width:100%;height:100%;display:block;min-height:260px}
.stage .nameline{display:flex;gap:8px;padding:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.stage input{flex:1;min-width:140px;font-family:var(--f-display);font-size:17px;color:var(--text);background:var(--well);border:0;border-radius:3px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line-hi)}
.stage input:focus{outline:2px solid var(--gold);outline-offset:1px}
.ppl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pp{border:0;cursor:pointer;padding:6px 2px 7px;border-radius:3px;background:var(--well);box-shadow:inset 0 0 0 1px #2a2219;display:grid;justify-items:center;gap:3px;font-size:13px;color:var(--muted)}
.pp canvas{width:46px;height:46px}
.pp.on{box-shadow:inset 0 0 0 1px var(--gold),0 0 10px rgba(213,174,99,.25);color:var(--gold-hi)}
.traits{display:grid;gap:5px;font-size:14.5px}
.traits li{list-style:none;display:flex;gap:7px;align-items:baseline}
.traits li::before{content:"";width:7px;height:7px;flex:none;transform:rotate(45deg);background:var(--ember);translate:0 -1px}
.traits ul{margin:0;padding:0;display:grid;gap:5px}
.cside{overflow:auto;display:grid;gap:10px;align-content:start}

/* ── Apparence ─────────────────────────────────── */
.looked{padding:10px 12px 12px;border-top:1px solid #2a2219}
.lrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;padding:4px 0}
.lrow>span{font-size:14px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 0 1px var(--line)}
.sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 0 2px var(--gold-hi),0 0 10px rgba(241,214,149,.4)}
.chipbtn{font-size:13.5px;padding:4px 10px;border-radius:14px;border:0;cursor:pointer;background:var(--well);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chipbtn.on{color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(213,174,99,.12)}
.sw:focus-visible,.chipbtn:focus-visible,.xray:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:16px;height:5px;border-radius:2px;background:#000;box-shadow:inset 0 0 0 1px #3a2f22}.pips i.on{background:var(--gold);box-shadow:0 0 5px rgba(213,174,99,.5)}
.xray{position:absolute;left:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(10,8,6,.8);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-hi)}
.xray svg{width:22px;height:22px}.xray.on{color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-hi),0 0 12px rgba(241,214,149,.35)}

/* ── Bonus d'expédition ─────────────────────────── */
.boons{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.boon{display:grid;justify-items:center;gap:4px;text-align:center;padding:10px 8px;border:0;border-radius:4px;cursor:pointer;background:var(--well);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.boon b{font-family:var(--f-display);font-size:13.5px;color:var(--gold-hi)}.boon span:last-child{font-size:13px;color:var(--muted)}
.boon:hover{box-shadow:inset 0 0 0 1px var(--gold),0 0 12px rgba(241,214,149,.25)}
.boon:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ── Modale & toasts ────────────────────────────── */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,4,3,.72);backdrop-filter:blur(3px);padding:max(16px,env(safe-area-inset-left,0px))}
#modal .panel{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px}
.mtitle{font-family:var(--f-display);font-size:21px;color:var(--gold-hi);text-align:center;margin-bottom:6px}
.mfoot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.anvilgame{display:grid;gap:12px;justify-items:center}
.track{position:relative;width:100%;height:30px;border-radius:15px;background:linear-gradient(90deg,#1b130d,#3a2412 30%,#7a3a14 45%,#f0a34a 50%,#7a3a14 55%,#3a2412 70%,#1b130d);box-shadow:inset 0 0 0 1px #000,0 0 0 1px var(--line-hi)}
.track .zone{position:absolute;top:0;bottom:0;border-radius:15px;box-shadow:inset 0 0 0 1px rgba(255,230,170,.6)}
.track .cursor{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--gold-hi);box-shadow:0 0 10px var(--gold-hi);border-radius:2px}
.strikes{display:flex;gap:8px}
.strikes span{min-width:70px;text-align:center;padding:4px 8px;border-radius:3px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.result{display:grid;justify-items:center;gap:8px;text-align:center}
.burst{animation:burst .9s ease-out}
@keyframes burst{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:6px;pointer-events:none}
.toast{padding:9px 14px;border-radius:3px;background:rgba(20,15,11,.95);box-shadow:inset 0 0 0 1px var(--line-hi),0 6px 16px rgba(0,0,0,.6);font-size:15px;animation:tin .25s ease-out;max-width:340px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ── Responsive ─────────────────────────────────── */

/* ── Appli, réglages, menu « Plus » ── */
button,canvas,a{touch-action:manipulation}
.navb.more{display:none}
.gearb{border:0;background:transparent;color:var(--gold);width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.gearb svg{width:22px;height:22px;fill:none;stroke:currentColor}
.gearb:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheetb{position:relative;display:grid;justify-items:center;gap:6px;padding:14px 6px;border:0;border-radius:4px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);font-family:var(--f-display);font-size:13px;cursor:pointer}
.sheetb svg{width:28px;height:28px;color:var(--gold)}
.sheetb.on{box-shadow:inset 0 0 0 1px var(--gold-hi);color:var(--gold-hi)}
.sheetb .dot{position:absolute;right:8px;top:8px;min-width:18px;height:18px;border-radius:9px;background:#a3271c;color:#fff;font-size:11px;display:grid;place-items:center;font-family:var(--f-body)}
.isteps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.isteps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:start}
.isteps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#8a3b16,#4a1e0b);color:var(--gold-hi);font-family:var(--f-display);box-shadow:inset 0 0 0 1px var(--line-hi)}
.isteps span{color:var(--muted);font-size:14px}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.diffs .pp{padding:10px 4px}
.unitcard.compact{width:auto;min-width:150px;padding:6px 10px}
@media (max-width:1180px){.home{grid-template-columns:1fr}.home-side{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.forge{grid-template-columns:170px minmax(0,1fr)}.forge .detail{grid-column:1/-1}}
@media (max-width:980px){.create{grid-template-columns:1fr;height:auto;overflow:visible}.classlist{max-height:none}#app.solo #view{overflow:auto}.cards4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){

  .navb{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;min-width:64px;align-items:center;text-align:center;letter-spacing:0}
  .navb.on{box-shadow:inset 0 -2px 0 var(--ember);background:linear-gradient(0deg,rgba(236,122,48,.22),transparent)}

  .nav-foot{display:none}
  .navb.sec{display:none}
  .navb.more{display:flex}
  #nav{overflow:visible;justify-content:space-around}
  .navb{flex:1 1 0;min-width:0;padding:7px 2px}
  #app{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .gearb{order:2;margin-left:auto;width:36px;height:36px}
  .curr{order:3}
  .who{order:1;min-width:0;flex:1 1 auto}

  #dun{gap:6px}
  .dtop{padding:6px 10px;gap:4px 10px}
  .dtop h2{font-size:15px}.dtop .sub{font-size:12.5px}
  .mini{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:2px 12px;margin-left:0}
  .mini .bar{width:auto}
  .dbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px}
  .dbar .btn{min-width:0;padding:11px 4px;font-size:13px}
  .turnflag{top:6px;font-size:12px;padding:4px 10px}
  #modal .panel{padding:16px}
  .create .stage{order:-1}
  .forge>.list.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .forge>.list.cats .cat{flex:0 0 auto;width:auto;white-space:nowrap;padding:7px 10px}
  .classlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccls{padding:7px 8px;gap:8px}.ccls span{display:none}.ccls .ci{width:32px;height:32px}.ccls .ci svg{width:20px;height:20px}.ccls b{font-size:13px}
  .mini .bar .lab{white-space:nowrap;font-size:12px}
  #toasts{left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));justify-items:center}
  #app.solo~#toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .brand span,.clock{display:none}
  .brand b{font-size:16px}
  #hud{gap:8px;padding:6px 10px}
  .crest{width:36px;height:36px}
  .xpbar{width:100px}
  .curr{gap:4px;margin-left:0;width:100%}
  .cur{font-size:13px;padding:2px 8px 2px 3px}.cur svg{width:20px;height:20px}
  .forge,.dgcards,.mast{grid-template-columns:1fr!important}
  .abyssgrid{grid-template-columns:1fr}.dg.abyss canvas{min-height:150px}.merc{grid-template-columns:1fr}.merc canvas{width:100%}
  .mini .bar{width:84px}
  .dbar .btn{min-width:0;flex:1 1 40%;padding:10px 6px;font-size:13.5px}
  .unitcard{width:min(190px,48%);font-size:12.5px;padding:8px 10px;top:auto;bottom:8px}
  .dlog{max-width:48%;font-size:12px}
  .lrow{grid-template-columns:78px 1fr}
  .scene{height:300px}
}

/* Téléphone à l'horizontale : navigation en colonne d'icônes, commandes de combat à droite */
@media (max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:62px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"nav hud" "nav view";padding:4px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px));gap:6px}
  #nav{flex-direction:column;overflow-y:auto;padding:4px;gap:2px}

  .navb.sec{display:none}.navb.more{display:flex}.nav-foot{display:none}
  #hud{padding:4px 10px;gap:10px;flex-wrap:nowrap}.brand,.clock,.who .cl,.xpbar{display:none}.crest{width:32px;height:32px}
  .curr{margin-left:auto;flex-wrap:nowrap;width:auto}.cur{font-size:13px;padding:2px 8px 2px 3px}.cur svg{width:18px;height:18px}
  .scene{height:calc(100vh - 90px)}
  #dun{grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:auto 1fr;grid-template-areas:"top top" "mid bar";gap:6px}

}
/* Appli installée : on respecte l'encoche et la barre système */
html.standalone #app{padding-top:max(10px,env(safe-area-inset-top,0px))}
html.standalone body{overscroll-behavior:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════ Atelier : craft ═══════════════════════ */

/* Amélioration : +1 niveau, sans risque jusqu'à +4, puis chances décroissantes. L'échec coûte les matériaux, jamais l'objet. */

/* Recyclage : rendement × rareté × état × (1 + Commerce). Runes rendues intactes. */

/* Runes */

/* Équipement & consommables */
/* Valeur d'un équipement pour ce héros (sert au repère « mieux que l'équipé ») */

function unequip(slot) { const it = S.equip[slot]; if (!it) return; if (S.stash.length >= stashCap()) return "Réserve pleine."; S.equip[slot] = null; S.stash.push(it); clampVit(); save(); return null; }

const restCost = () => 15 + 5 * S.lvl;

/* Quêtes */
function questState(q) {
  if (S.claimed.includes(q.id)) return { st: "claimed", cur: 1, max: 1 };
  if (q.req && !S.claimed.includes(q.req)) return { st: "locked", cur: 0, max: 1 };
  const [cur, max] = q.goal(S); return { st: cur >= max ? "done" : "active", cur: Math.min(cur, max), max };
}
function claim(q) {
  const s = questState(q); if (s.st !== "done") return;
  const rw = q.rw; S.claimed.push(q.id);
  if (rw.gold) S.gold += rw.gold; if (rw.crys) S.crys += rw.crys; if (rw.xp) gainXp(rw.xp);
  if (rw.pts) S.bonusPts = (S.bonusPts || 0) + rw.pts;
  if (rw.perma) addPerma(rw.perma);
  for (const [id, n] of rw.items || []) addId(S.stash, id, n, 0, stashCap());

const questsReady = () => QUESTS.filter(q => questState(q).st === "done").length;
function addPerma(p) { S.perma = S.perma || {}; for (const k in p) S.perma[k] = +((S.perma[k] || 0) + p[k]).toFixed(3); clampVit(); }

/* Installations de la Forge */

function buildInstall(id) {

/* Rangs de brume : chaque gardien vaincu débloque un rang de plus dans son donjon */
const maxRank = did => Math.min(5, (S.st.boss[DG(did).boss] || 0));

/* ═══════════════════════ Commandes des villageois ═══════════════════════ */
function genOrder() {
  const pool = REC.filter(r => r.station !== "autel" && r.cat !== "special" && r.lvl <= S.lvl + 1 && r.out !== "epee_usee");
  const r = pick(pool), d = IT[r.out], eq = isEquip(d);
  const qty = eq ? (r.lvl >= 4 && Math.random() < .3 ? 2 : 1) : ri(3, 5);
  let minR = 0; if (eq && S.lvl >= 3 && Math.random() < .4) minR = 1; if (eq && S.lvl >= 6 && Math.random() < .15) minR = 2;
  minR = Math.max(minR, d.minR || 0);
  const gold = Math.round((d.val * qty * (1 + minR) * .8 + r.gold * qty * .45) * (1 + bonus("orderGold")) / 5) * 5;
  return { id: uid(), npc: pick(NPCS), item: r.out, rec: r.id, qty, minR, due: S.day + ri(1, 3), gold, xp: 15 + r.lvl * 8, crys: minR >= 2 ? 2 : (Math.random() < .2 ? 1 : 0) };
}
function ensureOrders() {
  if (!S.orders) S.orders = [];

  if (late.length) { S.orders = S.orders.filter(o => S.day <= o.due); S.renown = Math.max(0, (S.renown || 0) - late.length); for (const o of late) toast(`Commande expirée : ${o.npc} est déçu.`, "bad"); }
  // une nouvelle commande par jour, trois au plus ; jamais moins d'une
  if (S.orders.length < 3 + bonus("orderSlot") && (S.orderDay || 0) < S.day) { S.orders.push(genOrder()); S.orderDay = S.day; }
  if (!S.orders.length) S.orders.push(genOrder());
}
function orderMatches(o) { const d = IT[o.item]; return isEquip(d) ? S.stash.filter(it => it.id === o.item && it.r >= o.minR && it.dur > 0) : S.stash.filter(it => it.id === o.item); }
function canDeliver(o) { return isEquip(IT[o.item]) ? orderMatches(o).length >= o.qty : count(S.stash, o.item) >= o.qty; }
function deliver(oid) {
  const o = S.orders.find(x => x.id === oid); if (!o || !canDeliver(o)) return "Il vous manque des objets.";
  if (isEquip(IT[o.item])) { const m = orderMatches(o).sort((a, b) => a.r - b.r || a.quality - b.quality).slice(0, o.qty); for (const it of m) removeInst(S.stash, it); }
  else removeId(S.stash, o.item, o.qty);
  S.gold += o.gold; S.crys += o.crys; gainXp(o.xp); S.renown = (S.renown || 0) + 1; S.st.orders = (S.st.orders || 0) + 1;
  S.orders = S.orders.filter(x => x !== o); save(); return null;

/* Apprendre un nœud de maîtrise : point disponible, pas déjà appris, nœud précédent de la branche acquis */
function learnNode(id) {
  const br = MASTERY.find(b => b.nodes.some(n => n.id === id)); if (!br) return "Nœud inconnu.";
  const i = br.nodes.findIndex(n => n.id === id);
  if (S.mastery.includes(id)) return "Déjà appris.";
  if (masteryPoints() <= 0) return "Aucun point disponible.";
  if (i > 0 && !S.mastery.includes(br.nodes[i - 1].id)) return "Apprenez d'abord le nœud précédent.";
  S.mastery.push(id); clampVit(); save(); return null;

/* ═══════════════════════ Contrats de la Guilde ═══════════════════════ */
function genContract() {

  const n = ri(T.range[0], T.range[1]) + (T.id === "kills" ? Math.floor(S.lvl / 2) : 0);
  const perm = Math.random() < .35; const rw = perm ? pick(PERMA_REWARDS) : { bless: pick(BLESSINGS).id, exps: ri(2, 4) };
  return { id: uid(), type: T.id, n: T.n, target: n, start: T.counter(S), due: S.day + ri(3, 5), rw, gold: 60 + n * 8 + S.lvl * 10 };
}
function ensureContracts() {

  if (S.contracts.length < 2 && (S.contractDay || 0) + 1 < S.day) { S.contracts.push(genContract()); S.contractDay = S.day; }
  if (!S.contracts.length) { S.contracts.push(genContract()); S.contractDay = S.day; }
}
const contractProg = c => Math.min(c.target, CONTRACT_TYPES.find(t => t.id === c.type).counter(S) - c.start);
const contractText = c => CONTRACT_TYPES.find(t => t.id === c.type).f(c.target);

let forgeGame = null;
const FSTEPS = [
  ["Chauffe", "Maintenez le soufflet jusqu'à la couleur cerise (zone dorée), puis sortez la pièce. Détermine la puissance de l'objet."],
  ["Trempe", "Plongez la lame quand le curseur traverse la zone claire. Détermine sa solidité (durabilité)."],

  renderForgeStep(); const g = forgeGame; let last = performance.now();
  const loop = now => { if (!forgeGame || forgeGame !== g || g.stop) return; const dt = Math.min(.05, (now - last) / 1000); last = now; g.t += dt; tickForge(g, dt); drawForge(g); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

  const ctrl = g.step === 0 ? `<div style="display:flex;gap:8px;width:100%"><button class="btn wide" id="bellows" style="font-size:16px;padding:12px;touch-action:none">Souffler (maintenir)</button><button class="btn ember wide" data-act="fstep" style="font-size:16px;padding:12px">Sortir du feu</button></div>`
    : g.step === 1 ? `<div class="track" id="track"><div class="zone" style="left:40%;width:20%;background:rgba(200,235,255,.25)"></div><div class="cursor" id="cur"></div></div><button class="btn ember wide" data-act="fstep" style="font-size:17px;padding:13px">Plonger</button>`

  const chips = (k, list) => `<div class="sws">${list.map((n, i) => `<button class="chipbtn ${lk[k] === i ? "on" : ""}" data-act="look" data-k="${k}" data-v="${i}">${n}</button>`).join("")}</div>`;

  tosalv: d => { UI.tab = "salv"; UI.sel = d.u; go("forge"); },
  learn: d => { const e = learnNode(d.n); toast(e || "Maîtrise apprise.", e ? "bad" : "gold"); rerender(); },
  respec: () => { const c = 50 + S.lvl * 10; if (S.gold < c) { toast("Or insuffisant.", "bad"); return; } S.gold -= c; S.mastery = []; clampVit(); save(); rerender(); },
  buy: d => { const o = SHOP[+d.i]; const left = o.limit ? o.limit - (S.bought[o.id] || 0) : 99; if (left <= 0) return; if (o.gold) { const p = shopPrice(o); if (S.gold < p) return; if (!addId(S.stash, o.id, o.n, 0, stashCap())) { toast("Réserve pleine.", "bad"); return; } S.gold -= p; } else { if (S.crys < o.crys) return; if (!addId(S.stash, o.id, o.n, 0, stashCap())) { toast("Réserve pleine.", "bad"); return; } S.crys -= o.crys; } S.bought[o.id] = (S.bought[o.id] || 0) + 1; save(); toast(`${IT[o.id].n} acheté.`); rerender(); },
  enter: d => { const dg = DG(d.d); if (dg.infinite && S.vit.hp < stats().hp * .3) { toast("Reposez-vous avant de plonger dans l'Abysse.", "bad"); return; } if (S.lvl < dg.rec - 1) { toast(`Trop dangereux : niveau ${dg.rec - 1} minimum.`, "bad"); return; } startExpedition(d.d, UI.rank[d.d] || 0); },
  dmode: d => { if (d.k) UI.lastSk = d.k; setMode(d.m, d.k); },
  salvjunk: () => { const n = salvageJunk(); UI.sel = null; toast(n ? `${n} objets recyclés en matériaux.` : "Rien à recycler.", n ? "" : "bad"); rerender(); },
  more: () => openMore(), gosheet: d => { closeModal(); go(d.v); },
  settings: () => openSettings(), installinfo: () => openInstall(),
  install: async () => { const p = PWA.prompt; if (!p) { openInstall(); return; } PWA.prompt = null; p.prompt(); try { await p.userChoice; } catch (e) { } closeModal(); rerender(); },
  fullscreen: () => { closeModal(); try { document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) { } },
  setdiff: d => { if (EX) { toast("Impossible pendant une expédition.", "bad"); return; } S.diff = d.id; save(); toast(`Difficulté : ${DIFF().n}.`, "gold"); openSettings(); renderHud(); },
  cdiff: d => { CR.diff = d.d; render(); },
  dskills: () => { const list = heroSkills(); openModal(`<div class="mtitle">Compétences</div><div class="list" style="gap:8px">${list.map(s => `<button class="row" data-act="dsk" data-k="${s.key}" ${S.vit.en >= costOf(s) ? "" : "disabled"} style="${S.vit.en >= costOf(s) ? "" : "opacity:.5"}"><div class="qicon">${nico("star")}</div><div class="t"><b>${s.n} <span class="faint">· ${costOf(s)} énergie</span></b><span>${s.d}</span></div></button>`).join("")}</div><div class="mfoot"><button class="btn ghost" data-act="close">Fermer</button></div>`); },
  dsk: d => { closeModal(); UI.lastSk = d.k; setMode("skill", d.k); },
  spec: d => { const s = (SPECS[S.cls] || []).find(x => x.id === d.id); if (!s) return; openModal(`<div class="mtitle">${s.n}</div><p style="text-align:center">${s.d}</p><p style="text-align:center"><b>${s.skill.n}</b> · ${s.skill.d}</p><p class="muted" style="text-align:center">Ce choix est définitif.</p><div class="mfoot"><button class="btn ghost" data-act="close">Annuler</button><button class="btn ember" data-act="specok" data-id="${s.id}">Choisir</button></div>`); },
  specok: d => { const e = chooseSpec(d.id); closeModal(); toast(e || `Spécialisation : ${specOf().n}. Nouvelle compétence : ${specOf().skill.n}.`, e ? "bad" : "gold"); rerender(); },
  qtab: d => { UI.qtab = d.t; rerender(); },
  toqtab: d => { UI.qtab = d.t; go("quests"); },
  lore: d => openLore(QUESTS.find(x => x.id === d.q), true),
  cclaim: d => { const c = S.contracts.find(x => x.id === d.id); const txt = c && contractRw(c); const e = claimContract(d.id); toast(e || `Contrat rempli : ${txt}`, e ? "bad" : "gold"); rerender(); },
  hire: d => { const e = hireMerc(d.t); toast(e || `${MERCS[d.t].n} vous accompagnera lors de la prochaine expédition.`, e ? "bad" : "gold"); rerender(); },
  recruit: d => { const e = recruitMerc(d.t); toast(e || `${MERCS[d.t].n} rejoint votre compagnie.`, e ? "bad" : "gold"); rerender(); },
  party: d => { const e = toggleParty(d.id); if (e) toast(e, "bad"); rerender(); },
  abup: d => { const e = buyAbyssUp(d.id); toast(e || `${ABYSS_UP.find(x => x.id === d.id).n} améliorée.`, e ? "bad" : "gold"); rerender(); },
  inntav: () => { closeModal(); go("taverne"); },
  ditems: () => { const list = S.stash.filter(i => IT[i.id].combat); openModal(`<div class="mtitle">Objets</div><p class="muted" style="text-align:center;margin:0 0 10px">Utilisés par l'unité sélectionnée. Cela compte comme son action.</p><div class="list">${list.map(i => `<button class="row" data-act="duse" data-id="${i.id}">${slotHTML(i, { size: "sm" })}<div class="t"><b>${IT[i.id].n}</b><span>${IT[i.id].d}</span></div></button>`).join("") || '<p class="muted">Aucun consommable de combat.</p>'}</div><div class="mfoot"><button class="btn ghost" data-act="close">Fermer</button></div>`); },
  duse: d => useItemInCombat(d.id),
  dend: () => endTurn(), dflee: () => flee(),
  dspeed: () => { SPEED = SPEED === 1 ? 2 : 1; refreshDun(); },
  descend: () => descend(),
  home: () => returnHome(0),
};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t.dataset, t); } });
document.addEventListener("keyup", e => { if (e.code === "Space" && forgeGame && forgeGame.step === 0) forgeGame.heating = false; });
document.addEventListener("keydown", e => { if (e.code === "Space" && forgeGame) { e.preventDefault(); if (forgeGame.step === 0) { if (!e.repeat) forgeGame.heating = true; } else if (!e.repeat) forgeAction(); } if (e.key === "Enter" && forgeGame && forgeGame.step === 0) forgeAction(); if (e.key === "Escape" && !$("#modal").hidden && !forgeGame && !(EX && (EX.pending || (EX.F && EX.F.phase === "won")))) closeModal(); });
setInterval(() => { document.querySelectorAll("[data-timer]").forEach(el => { el.textContent = fmtLeft(+el.dataset.timer - Date.now()); }); }, 1000);

/* Démarrage */
(function boot() {
  const s = load();
  if (s) { S = s; VIEW = "home"; }
  render();
})();
</script></body></html>
